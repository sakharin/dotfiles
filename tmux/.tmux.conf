set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Setting up VIM pane / window managment
setw -g mode-keys vi
unbind %
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Allow resizing splits
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf \; display 'Reloaded!'

# change number for windows and panes
set -g base-index 1

#==============================================================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
# set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# Set status position to top
# set-option -g status-position top
 
#==============================================================================
# 🎨 Catppuccin Theme

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number " #I"
set -g @catppuccin_window_text " #W  "
set -g @catppuccin_window_current_number " #I"
set -g @catppuccin_window_current_text " #W  "
set -ogq @catppuccin_window_current_number_color "#{@thm_blue}"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}#[bg=#{@thm_surface_0}]#[bg=#{@_ctp_status_bg}]#[none]"

# Configure the session module
set -ogq "@catppuccin_session_icon" "   "
set -ogq "@catppuccin_session_color" "#{?client_prefix,#{@thm_peach},#{@thm_blue}}"
set -ogq "@catppuccin_session_text" "  #S"

# 🛠️ General Settings

# Enable mouse support
set -g mouse on

# Set status bar position to top
set-option -g status-position top

# Color rendering settings for Neovim and Alacritty
# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6?permalink_comment_id=4701262#gistcomment-4701262
set-option -sa terminal-features ',alacritty:RGB'
set-option -ga terminal-features ",alacritty:usstyle"
set-option -ga terminal-overrides ',alacritty:Tc'

# Start windows and panes from 1
set -g base-index 1
set -g pane-base-index 1

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/tmux/catppuccin.tmux'
